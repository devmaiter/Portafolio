<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #0f172a; }
      .fg { fill: #38bdf8; }
      .fg2 { fill: #ffffff; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .fg { fill: #38bdf8; }
      .fg2 { fill: #ffffff; }
    }
  </style>
  <!-- Background rounded square -->
  <rect class="bg" width="180" height="180" rx="36" />

  <!-- Bracket [ -->
  <rect class="fg" x="22" y="30" width="10" height="120" rx="3"/>
  <rect class="fg" x="22" y="30" width="30" height="10" rx="3"/>
  <rect class="fg" x="22" y="140" width="30" height="10" rx="3"/>

  <!-- O -->
  <text
    x="90" y="118"
    font-family="'Courier New', Courier, monospace"
    font-size="72"
    font-weight="bold"
    text-anchor="middle"
    class="fg2"
  >OJ</text>

  <!-- Bracket ] -->
  <rect class="fg" x="148" y="30" width="10" height="120" rx="3"/>
  <rect class="fg" x="128" y="30" width="30" height="10" rx="3"/>
  <rect class="fg" x="128" y="140" width="30" height="10" rx="3"/>
</svg>